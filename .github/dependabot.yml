# Dependabot version updates for the two npm packages in this repo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor and patch bumps are grouped into one PR per package; major bumps
# arrive as separate PRs so breaking upgrades (e.g. a new Vite major that
# needs a matching @vitejs/plugin-react) can be reviewed on their own.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
